name: Bug report
description: Something isn't working as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Sirius is an **unofficial** CharaChorder tool.
        For device/firmware problems, contact CharaChorder instead.
  - type: input
    id: version
    attributes:
      label: Sirius version
      placeholder: e.g. v0.1.0 (release) or a commit SHA (dev)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I'm using a packaged build (not just the browser dev server)
        - label: On macOS, I granted Accessibility permission to Sirius
        - label: I searched existing issues for a duplicate
